<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#21160f">
<meta name="description" content="Pantry Dash: a cat-and-mouse kitchen chase game. Eat the cheese, grab chilies, dodge the cats.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='15,75 90,75 75,25' fill='%23ffcc3d' stroke='%23c98f0e' stroke-width='6'/><circle cx='55' cy='60' r='7' fill='%23e0a516'/></svg>">
<title>Pantry Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: compact HUD on top, the board sized to fit the screen, a big thumb d-pad below. Single dark "walnut kitchen at night" look by choice. */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#21160f;
  --panel:#33241a;
  --ink:#f7ecdd;
  --muted:#bfa995;
  --mint:#7fd8be;
  --cheese:#ffcc3d;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font-family:var(--body);padding:0 16px;padding-block:12px 16px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1;margin:0;color:var(--cheese);text-shadow:0 3px 0 #8a5a12}
.room{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.hud{display:flex;gap:6px;font-variant-numeric:tabular-nums;align-items:stretch}
.stat{background:var(--panel);border-radius:10px;padding:4px 8px;min-width:50px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.15rem;line-height:1.15}
.stat span{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.board{position:relative;width:100%;aspect-ratio:15/13;max-width:100%;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 0 0 4px #5a3b26,0 14px 30px rgba(0,0,0,.45);touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(33,22,15,.84);text-align:center;padding:16px}
.overlay h2{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,6vw,2.3rem);margin:0;color:var(--cheese)}
.overlay p{margin:0;max-width:34ch;line-height:1.45;font-size:clamp(.85rem,3.4vw,1rem)}
.overlay .small{color:var(--muted);font-size:.85rem}
button{font-family:var(--display);font-weight:400;cursor:pointer;border:0;border-radius:12px;color:#21160f;background:var(--cheese);font-size:1.15rem;padding:10px 24px;box-shadow:0 4px 0 #a8770f;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #a8770f}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.icon-btn{background:var(--panel);color:var(--ink);box-shadow:0 3px 0 #170f0a;font-size:1rem;padding:0 12px;min-width:44px}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;touch-action:none}
.pad button{padding:0;font-size:1.4rem;background:var(--panel);color:var(--ink);box-shadow:0 4px 0 #170f0a}
.pad button.on{background:#4a3424}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.help{color:var(--muted);font-size:.85rem;line-height:1.5;max-width:30ch;margin:0}
.help strong{color:var(--ink)}
@media (pointer:coarse){.help{display:none}.pad{grid-template-columns:repeat(3,76px);grid-template-rows:repeat(2,64px)}}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header id="top">
    <div>
      <h1>Pantry Dash</h1>
      <p class="room" id="room">Level 1 · The Kitchen</p>
    </div>
    <div class="hud">
      <div class="stat"><b id="score">0</b><span>Score</span></div>
      <div class="stat"><b id="level">1</b><span>Level</span></div>
      <div class="stat"><b id="lives">3</b><span>Lives</span></div>
      <button class="icon-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    </div>
  </header>

  <div class="board" id="board">
    <canvas id="game" aria-label="Kitchen maze game board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Ready, Pip?</h2>
      <p id="ovText"></p>
      <button id="ovBtn">Start</button>
      <p class="small" id="ovBest"></p>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="pad" aria-label="Direction buttons">
      <button class="up" data-dir="up" aria-label="Up">▲</button>
      <button class="left" data-dir="left" aria-label="Left">◀</button>
      <button class="down" data-dir="down" aria-label="Down">▼</button>
      <button class="right" data-dir="right" aria-label="Right">▶</button>
    </div>
    <p class="help"><strong>Arrows / WASD</strong> to move, <strong>P</strong> to pause. On a phone, swipe on the board or use the pad.</p>
  </div>
</div>

<script>
const LEVELS=[
 {name:'The Kitchen',a:'#bfe9dc',b:'#f4fbf8',wall:'#6b4428',top:'#8a5a36',map:[
"###############",
"#O.....#.....O#",
"#.##.#.#.#.##.#",
"#.............#",
"#.##.#####.##.#",
"#....#...#....#",
"##.#...C...#.##",
"#....#...#....#",
"#.##.#####.##.#",
"#......M......#",
"#.##.#.#.#.##.#",
"#O.....#.....O#",
"###############"]},
 {name:'The Pantry',a:'#f3d9a8',b:'#fff3dc',wall:'#4f5d75',top:'#6c7a93',map:[
"###############",
"#O...........O#",
"#.###.#.#.###.#",
"#.............#",
"###.#.###.#.###",
"#...#..C..#...#",
"#.#.#.#.#.#.#.#",
"#.#...#.#...#.#",
"#.###.#.#.###.#",
"#......M......#",
"#.##.##.##.##.#",
"#O...........O#",
"###############"]},
 {name:'The Dining Room',a:'#e6c3d6',b:'#fbeef5',wall:'#5b2c3f',top:'#7d3f57',map:[
"###############",
"#.....O.O.....#",
"#.###.#.#.###.#",
"#.#.........#.#",
"#.#.##.#.##.#.#",
"#......C......#",
"###.#.###.#.###",
"#...#.....#...#",
"#.#.#.###.#.#.#",
"#.#....M....#.#",
"#.###.#.#.###.#",
"#O...........O#",
"###############"]},
 {name:'The Bakery',a:'#cfe0f5',b:'#f3f8ff',wall:'#7a4b2a',top:'#a0663b',map:[
"###############",
"#O.....#.....O#",
"#.#.##.#.##.#.#",
"#.#.........#.#",
"#...##.#.##...#",
"###....C....###",
"#...#.###.#...#",
"#.#.#.....#.#.#",
"#.#...#.#...#.#",
"#.###.#M#.###.#",
"#.............#",
"#O.##.....##.O#",
"###############"]},
 {name:'The Midnight Fridge',a:'#2d3b55',b:'#3a4a68',wall:'#d7e3f0',top:'#ffffff',map:[
"###############",
"#O.#.......#.O#",
"#.....###.....#",
"#.###.....###.#",
"#.#...#.#...#.#",
"#...#.#C#.#...#",
"##.##.....##.##",
"#.....#.#.....#",
"#.#.###.###.#.#",
"#.#....M....#.#",
"#.#.##.#.##.#.#",
"#O...........O#",
"###############"]}
];
const BONUS=[
 {name:'Strawberry',pts:100},{name:'Donut',pts:200},{name:'Cupcake',pts:300},{name:'Watermelon',pts:400},{name:'Golden Cheese',pts:500}
];
const C=15,R=13;
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let T=32,grid,L,food,total,eaten,score=0,level=1,lives=3,best=0,state='menu',mouse,cats=[],scared=0,chain=0,timer=0,msg='',sub='';
let catStart={},mouseStart={},bonus=null,bonusSpawns=0,parts=[],floats=[];
try{best=+localStorage.getItem('pantryBest')||0}catch(e){}

/* ---------- sizing: fit the board to the screen ---------- */
function fit(){
  const wrap=$('wrap'),board=$('board');
  const used=$('top').offsetHeight+$('controls').offsetHeight+20+28;
  const availH=window.innerHeight-used;
  const w=Math.max(240,Math.min(wrap.clientWidth,availH*15/13));
  board.style.width=w+'px';
  const d=window.devicePixelRatio||1;
  canvas.width=Math.round(w*d);canvas.height=Math.round(w*13/15*d);T=w/C;ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize',fit);

/* ---------- level setup ---------- */
function loadLevel(){
  L=LEVELS[(level-1)%LEVELS.length];
  grid=L.map.map(r=>r.split(''));food=0;
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const ch=grid[y][x];
    if(ch==='M'){mouseStart={x,y};grid[y][x]=' '}
    else if(ch==='C'){catStart={x,y};grid[y][x]=' '}
    if(grid[y][x]==='.'||grid[y][x]==='O')food++;
  }
  total=food;eaten=0;bonus=null;bonusSpawns=0;parts=[];floats=[];
  const lap=Math.floor((level-1)/LEVELS.length);
  $('room').textContent=`Level ${level} · ${L.name}${lap?' (round '+(lap+1)+')':''}`;
  resetActors();
}
const catSpeed=()=>Math.min(3.0+level*0.22,4.6);
function makeCat(kind,wait){
  return {x:catStart.x,y:catStart.y,tx:catStart.x,ty:catStart.y,p:0,dir:[0,0],face:[-1,0],speed:catSpeed()*(kind?0.93:1),wait,kind};
}
function resetActors(){
  mouse={x:mouseStart.x,y:mouseStart.y,tx:mouseStart.x,ty:mouseStart.y,p:0,dir:[0,0],want:null,speed:4.4,face:[1,0]};
  cats=[makeCat(0,1.0)];
  if(level>=3)cats.push(makeCat(1,4.0));
  scared=0;
}
function startIntro(m,s){state='intro';timer=1.6;msg=m;sub=s}

const wall=(x,y)=>x<0||y<0||x>=C||y>=R||grid[y][x]==='#';
const at=e=>e.p>0.5?{x:e.tx,y:e.ty}:{x:e.x,y:e.y};
const pos=e=>({x:e.x+(e.tx-e.x)*e.p,y:e.y+(e.ty-e.y)*e.p});

function move(e,dt,choose,arrive){
  let left=e.speed*dt;
  while(left>0){
    if(e.tx===e.x&&e.ty===e.y){
      const d=choose(e);if(!d)return;
      e.tx=e.x+d[0];e.ty=e.y+d[1];e.dir=d;e.face=d;e.p=0;
    }
    const need=1-e.p;
    if(left<need){e.p+=left;return}
    left-=need;e.x=e.tx;e.y=e.ty;e.p=0;arrive&&arrive(e);
    if(state!=='play')return;
  }
}
function mouseChoose(e){
  if(e.want&&!wall(e.x+e.want[0],e.y+e.want[1]))return e.want;
  if((e.dir[0]||e.dir[1])&&!wall(e.x+e.dir[0],e.y+e.dir[1]))return e.dir;
  return null;
}
function burst(x,y,colors,n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=spd*(.4+Math.random()*.8);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.4,c:colors[i%colors.length]})}
}
function floatText(x,y,text,color){floats.push({x,y,text,color,life:1.1})}
function mouseArrive(e){
  const c=grid[e.y][e.x];
  if(c==='.'){grid[e.y][e.x]=' ';score+=10;food--;eaten++;burst(e.x+.5,e.y+.5,['#ffcc3d','#fff1a8'],3,2)}
  else if(c==='O'){grid[e.y][e.x]=' ';score+=50;food--;eaten++;
    scared=Math.max(7-level*0.35,3.5);chain=0;cats.forEach(k=>k.speed=2.2);
    burst(e.x+.5,e.y+.5,['#e8463b','#ff9a3c','#ffd23f'],16,4);floatText(e.x+.5,e.y+.2,'SPICY!','#ff6b4a')}
  if(bonusSpawns<2&&eaten>=total*(bonusSpawns===0?0.3:0.65))spawnBonus();
  if(food<=0){state='levelup';timer=1.8;msg=`${L.name.replace('The ','')} cleared!`;sub='+'+(500*level)+' bonus';score+=500*level}
}
function spawnBonus(){
  const m=at(mouse),spots=[];
  for(let y=0;y<R;y++)for(let x=0;x<C;x++)
    if(!wall(x,y)&&Math.abs(x-m.x)+Math.abs(y-m.y)>=5&&!(x===catStart.x&&y===catStart.y))spots.push({x,y});
  const s=spots[Math.random()*spots.length|0];
  const type=((level-1)+bonusSpawns)%BONUS.length;
  bonus={x:s.x,y:s.y,type,t:9,born:performance.now()};bonusSpawns++;
  burst(s.x+.5,s.y+.5,['#ffffff','#ffe066'],10,3);
}
function neighbors(x,y){return Object.values(DIRS).filter(d=>!wall(x+d[0],y+d[1]))}
function catChoose(e){
  const opts=neighbors(e.x,e.y);if(!opts.length)return null;
  const m=at(mouse);
  const nonRev=opts.filter(d=>!(d[0]===-e.dir[0]&&d[1]===-e.dir[1]));
  if(scared>0){
    let bestD=-1,pick=[];
    for(const d of (nonRev.length?nonRev:opts)){
      const dist=Math.abs(e.x+d[0]-m.x)+Math.abs(e.y+d[1]-m.y);
      if(dist>bestD){bestD=dist;pick=[d]}else if(dist===bestD)pick.push(d);
    }
    return pick[Math.random()*pick.length|0];
  }
  const chaos=Math.max(0.04,0.3-level*0.05)+(e.kind?0.08:0);
  if(Math.random()<chaos&&nonRev.length)return nonRev[Math.random()*nonRev.length|0];
  // second cat aims a few tiles ahead of the mouse to cut it off
  let goal=m;
  if(e.kind===1){const d=mouse.dir;for(let k=3;k>0;k--){const gx=m.x+d[0]*k,gy=m.y+d[1]*k;if(!wall(gx,gy)){goal={x:gx,y:gy};break}}
    if(goal.x===e.x&&goal.y===e.y)goal=m}
  const prev=new Map(),key=(x,y)=>x+','+y,q=[[e.x,e.y]];prev.set(key(e.x,e.y),null);
  while(q.length){
    const [x,y]=q.shift();if(x===goal.x&&y===goal.y)break;
    for(const d of neighbors(x,y)){const k=key(x+d[0],y+d[1]);if(!prev.has(k)){prev.set(k,[x,y,d]);q.push([x+d[0],y+d[1]])}}
  }
  let k=key(goal.x,goal.y),step=null;
  while(prev.get(k)){const [px,py,d]=prev.get(k);step=d;k=key(px,py)}
  return step||opts[0];
}

function update(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.y-=dt*.9;f.life-=dt}
  floats=floats.filter(f=>f.life>0);
  if(state==='intro'||state==='levelup'||state==='caught'){
    timer-=dt;
    if(timer<=0){
      if(state==='levelup'){level++;loadLevel();
        const L2=LEVELS[(level-1)%LEVELS.length];
        startIntro(`Level ${level}`,L2.name+(level===3?' · a second cat joins!':''));}
      else if(state==='caught'){
        if(lives<=0){gameOver();return}
        resetActors();startIntro('Get ready!',lives===1?'Last life!':lives+' lives left');
      }else{state='play';msg='';sub=''}
    }
    return;
  }
  if(state!=='play')return;
  move(mouse,dt,mouseChoose,mouseArrive);
  if(state!=='play')return;
  if(scared>0){scared-=dt;if(scared<=0){scared=0;cats.forEach(k=>k.speed=catSpeed()*(k.kind?0.93:1))}}
  const a=pos(mouse);
  if(bonus){
    bonus.t-=dt;
    if(Math.hypot(a.x-bonus.x,a.y-bonus.y)<0.6){
      const b=BONUS[bonus.type];score+=b.pts;
      burst(bonus.x+.5,bonus.y+.5,['#ff4d6d','#ffd23f','#7fd8be','#a78bfa','#ffffff'],26,5);
      floatText(bonus.x+.5,bonus.y+.3,'+'+b.pts,'#ffe066');bonus=null;
    }else if(bonus.t<=0)bonus=null;
  }
  for(const cat of cats){
    if(cat.wait>0)cat.wait-=dt;else move(cat,dt,catChoose);
    const b=pos(cat);
    if(Math.hypot(a.x-b.x,a.y-b.y)<0.6&&cat.wait<=0){
      if(scared>0){
        chain++;const pts=200*chain;score+=pts;
        burst(b.x+.5,b.y+.5,['#8fb7d6','#ffffff'],14,4);floatText(b.x+.5,b.y+.3,'+'+pts,'#bfe3ff');
        Object.assign(cat,{x:catStart.x,tx:catStart.x,y:catStart.y,ty:catStart.y,p:0,dir:[0,0],wait:2.5});
      }else{
        lives--;state='caught';timer=1.4;msg='Caught!';sub='';
        burst(a.x+.5,a.y+.5,['#9aa0a6','#f3b4c0'],14,3);return;
      }
    }
  }
}

/* ---------- drawing ---------- */
function drawFloor(){
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const px=x*T,py=y*T;
    if(grid[y][x]==='#'){
      ctx.fillStyle=L.wall;ctx.fillRect(px,py,T+.5,T+.5);
      if(!wall(x,y+1)){ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(px,py+T*.82,T+.5,T*.18)}
      if(!wall(x,y-1)){ctx.fillStyle=L.top;ctx.fillRect(px,py,T+.5,T*.2)}
    }else{
      ctx.fillStyle=(x+y)%2?L.a:L.b;ctx.fillRect(px,py,T+.5,T+.5);
    }
  }
  const hx=(catStart.x+.5)*T,hy=(catStart.y+.5)*T;
  ctx.fillStyle='rgba(138,90,54,.35)';ctx.beginPath();ctx.ellipse(hx,hy+T*.15,T*.48,T*.3,0,0,Math.PI*2);ctx.fill();
}
function drawCrumbs(){
  const now=performance.now();
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const cx=(x+.5)*T,cy=(y+.5)*T,c=grid[y][x];
    if(c==='.'){
      ctx.fillStyle='#ffcc3d';ctx.strokeStyle='#c98f0e';ctx.lineWidth=Math.max(1,T*.04);
      ctx.beginPath();ctx.moveTo(cx-T*.14,cy+T*.1);ctx.lineTo(cx+T*.15,cy+T*.1);ctx.lineTo(cx+T*.1,cy-T*.12);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#e0a516';ctx.beginPath();ctx.arc(cx+T*.03,cy+T*.03,T*.03,0,Math.PI*2);ctx.fill();
      if(Math.sin(now/400+x*1.7+y*2.3)>0.96){star(cx+T*.12,cy-T*.12,T*.08,'#fff')}
    }else if(c==='O'){
      const s=1+Math.sin(now/220)*.1;
      glow(cx,cy,T*.6,'255,90,60');
      ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.rotate(-.5);
      ctx.fillStyle='#e8463b';ctx.beginPath();
      ctx.moveTo(-T*.08,-T*.24);ctx.quadraticCurveTo(T*.26,-T*.15,T*.05,T*.3);ctx.quadraticCurveTo(-T*.22,0,-T*.08,-T*.24);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(T*.02,-T*.08,T*.03,T*.09,.3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#3c9a4a';ctx.fillRect(-T*.11,-T*.33,T*.09,T*.12);
      ctx.restore();
    }
  }
}
function glow(cx,cy,r,rgb){
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,`rgba(${rgb},.55)`);g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
}
function star(x,y,r,col){
  ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.35:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
  ctx.closePath();ctx.fill();
}
/* ---- bonus foods ---- */
function drawBonusFood(type,s){
  const P=Math.PI;
  if(type===0){ // strawberry
    ctx.fillStyle='#e4223f';ctx.beginPath();ctx.moveTo(0,s*.42);
    ctx.bezierCurveTo(-s*.5,s*.1,-s*.42,-s*.3,0,-s*.22);ctx.bezierCurveTo(s*.42,-s*.3,s*.5,s*.1,0,s*.42);ctx.fill();
    ctx.fillStyle='#ffe9a8';for(const [x,y] of [[-.15,-.05],[.12,-.08],[0,.08],[-.18,.14],[.17,.12],[0,.26],[-.05,-.15]]){ctx.beginPath();ctx.ellipse(x*s,y*s,s*.025,s*.04,0,0,P*2);ctx.fill()}
    ctx.fillStyle='#2fa84f';for(let i=0;i<5;i++){ctx.save();ctx.translate(0,-s*.25);ctx.rotate(-P/2+(i-2)*.55);ctx.beginPath();ctx.ellipse(s*.12,0,s*.13,s*.05,0,0,P*2);ctx.fill();ctx.restore()}
  }else if(type===1){ // donut
    ctx.fillStyle='#d99a55';ctx.beginPath();ctx.arc(0,0,s*.4,0,P*2);ctx.arc(0,0,s*.13,0,P*2,true);ctx.fill('evenodd');
    ctx.fillStyle='#ff7eb6';ctx.beginPath();
    for(let i=0;i<=24;i++){const a=i/24*P*2,r=s*(.34+Math.sin(i*2.3)*.03);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
    ctx.arc(0,0,s*.16,0,P*2,true);ctx.fill('evenodd');
    const cols=['#ffffff','#7fd8be','#ffd23f','#7b6cff','#ff4d4d'];
    ctx.lineWidth=Math.max(1.5,s*.04);ctx.lineCap='round';
    for(let i=0;i<12;i++){const a=i*.53,r=s*(.22+(i%3)*.04);ctx.strokeStyle=cols[i%5];
      ctx.beginPath();ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a)*r+Math.cos(a*3)*s*.05,Math.sin(a)*r+Math.sin(a*3)*s*.05);ctx.stroke()}
  }else if(type===2){ // cupcake
    ctx.fillStyle='#4fb3d9';ctx.beginPath();ctx.moveTo(-s*.3,0);ctx.lineTo(s*.3,0);ctx.lineTo(s*.22,s*.4);ctx.lineTo(-s*.22,s*.4);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=Math.max(1,s*.03);
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*s*.11,s*.02);ctx.lineTo(i*s*.085,s*.38);ctx.stroke()}
    ctx.fillStyle='#fff0f6';for(const [x,y,r] of [[-.2,-.02,.14],[.2,-.02,.14],[0,-.06,.17],[-.08,-.2,.13],[.1,-.2,.12],[0,-.3,.1]]){ctx.beginPath();ctx.arc(x*s,y*s,r*s,0,P*2);ctx.fill()}
    ctx.fillStyle='#ffb3cf';ctx.beginPath();ctx.arc(-s*.12,-s*.12,s*.05,0,P*2);ctx.fill();
    ctx.fillStyle='#d2143a';ctx.beginPath();ctx.arc(0,-s*.42,s*.09,0,P*2);ctx.fill();
    ctx.strokeStyle='#4a7a2a';ctx.lineWidth=Math.max(1,s*.03);ctx.beginPath();ctx.moveTo(0,-s*.5);ctx.quadraticCurveTo(s*.05,-s*.6,s*.12,-s*.6);ctx.stroke();
  }else if(type===3){ // watermelon slice
    ctx.save();ctx.translate(0,-s*.1);
    ctx.fillStyle='#2e9e4f';ctx.beginPath();ctx.arc(0,0,s*.45,0,P);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e9f7d8';ctx.beginPath();ctx.arc(0,0,s*.39,0,P);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff4d5e';ctx.beginPath();ctx.arc(0,0,s*.34,0,P);ctx.closePath();ctx.fill();
    ctx.fillStyle='#2a1a1a';for(const [x,y] of [[-.18,.08],[0,.12],[.18,.08],[-.08,.22],[.09,.22]]){ctx.beginPath();ctx.ellipse(x*s,y*s,s*.025,s*.04,0,0,P*2);ctx.fill()}
    ctx.restore();
  }else{ // golden cheese wheel
    ctx.fillStyle='#f2b705';ctx.beginPath();ctx.arc(0,0,s*.4,0,P*2);ctx.fill();
    ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,s*.4,-.35,P*1.75);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e0a516';for(const [x,y,r] of [[-.15,-.12,.06],[.08,.15,.07],[-.18,.17,.045],[.2,-.02,.04]]){ctx.beginPath();ctx.arc(x*s,y*s,r*s,0,P*2);ctx.fill()}
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=Math.max(1.5,s*.04);ctx.beginPath();ctx.arc(0,0,s*.32,P*1.05,P*1.35);ctx.stroke();
  }
}
function drawBonus(){
  if(!bonus)return;
  const now=performance.now(),cx=(bonus.x+.5)*T,cy=(bonus.y+.5)*T;
  if(bonus.t<2.5&&Math.floor(bonus.t*8)%2)return;
  const pop=Math.min(1,(now-bonus.born)/250);
  glow(cx,cy,T*(.8+.12*Math.sin(now/180)),'255,230,120');
  ctx.save();ctx.translate(cx,cy);ctx.rotate(now/900);
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=Math.max(1,T*.03);
  for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*T*.42,Math.sin(a)*T*.42);ctx.lineTo(Math.cos(a)*T*.58,Math.sin(a)*T*.58);ctx.stroke()}
  ctx.restore();
  ctx.save();ctx.translate(cx,cy+Math.sin(now/200)*T*.06);ctx.scale(pop*1.15,pop*1.15);
  drawBonusFood(bonus.type,T);ctx.restore();
  for(let i=0;i<3;i++){const a=now/500+i*2.1;star(cx+Math.cos(a)*T*.5,cy+Math.sin(a)*T*.5,T*.07*(1+Math.sin(now/150+i)*.4),'#fff')}
}
function drawMouse(){
  const p=pos(mouse),cx=(p.x+.5)*T,cy=(p.y+.5)*T,f=mouse.face,ang=Math.atan2(f[1],f[0]);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
  ctx.strokeStyle='#e79aa8';ctx.lineWidth=Math.max(1.5,T*.05);ctx.lineCap='round';
  const wig=Math.sin(performance.now()/90)*T*.08;
  ctx.beginPath();ctx.moveTo(-T*.3,0);ctx.quadraticCurveTo(-T*.45,wig,-T*.5,-wig*.5);ctx.stroke();
  ctx.fillStyle='#9aa0a6';ctx.beginPath();ctx.ellipse(0,0,T*.32,T*.22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#b9bec3';ctx.beginPath();ctx.ellipse(T*.18,0,T*.17,T*.15,0,0,Math.PI*2);ctx.fill();
  for(const s of[-1,1]){ctx.fillStyle='#9aa0a6';ctx.beginPath();ctx.arc(T*.08,s*T*.17,T*.11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f3b4c0';ctx.beginPath();ctx.arc(T*.08,s*T*.17,T*.065,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1d1d1d';ctx.beginPath();ctx.arc(T*.22,s*T*.06,T*.035,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#e8768a';ctx.beginPath();ctx.arc(T*.35,0,T*.045,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawCat(cat){
  const p=pos(cat),cx=(p.x+.5)*T,cy=(p.y+.5)*T;
  const flash=scared>0&&scared<1.6&&Math.floor(scared*6)%2===0;
  const base=cat.kind?['#4b4f58','#2b2e35']:['#f08a2b','#b9561a'];
  const body=scared>0?(flash?base[0]:'#8fb7d6'):base[0],stripe=scared>0?'#5d86a8':base[1];
  ctx.save();ctx.translate(cx,cy);
  if(cat.wait>0&&state==='play')ctx.globalAlpha=.55+.4*Math.sin(performance.now()/120);
  const r=T*.4;
  ctx.fillStyle=body;
  for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*r*.85,-r*.35);ctx.lineTo(s*r*.75,-r*1.15);ctx.lineTo(s*r*.2,-r*.8);ctx.closePath();ctx.fill()}
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  if(cat.kind&&!scared){ctx.fillStyle='#f2f2f2';ctx.beginPath();ctx.ellipse(0,r*.35,r*.45,r*.4,0,0,Math.PI*2);ctx.fill()}
  ctx.strokeStyle=stripe;ctx.lineWidth=Math.max(1.5,T*.05);ctx.lineCap='round';
  for(const sx of[-.3,0,.3]){ctx.beginPath();ctx.moveTo(sx*r,-r*.95);ctx.lineTo(sx*r,-r*.65);ctx.stroke()}
  const lx=cat.face[0]*r*.12,ly=cat.face[1]*r*.12;
  for(const s of[-1,1]){
    ctx.fillStyle='#fffbe8';ctx.beginPath();ctx.ellipse(s*r*.35+lx*.3,-r*.08,r*.2,r*.24,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=scared>0?'#1d2a36':(cat.kind?'#d9a400':'#2a7d3a');ctx.beginPath();ctx.ellipse(s*r*.35+lx,-r*.08+ly,r*.08,r*.15,0,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#d2557a';ctx.beginPath();ctx.moveTo(-r*.09,r*.22);ctx.lineTo(r*.09,r*.22);ctx.lineTo(0,r*.33);ctx.closePath();ctx.fill();
  ctx.strokeStyle=cat.kind?'#9aa0a6':'#4a2a14';ctx.lineWidth=Math.max(1,T*.03);
  if(scared>0){ctx.strokeStyle='#1d2a36';ctx.beginPath();ctx.moveTo(-r*.35,r*.55);for(let i=1;i<=4;i++)ctx.lineTo(-r*.35+i*r*.175,r*(i%2?.47:.55));ctx.stroke()}
  for(const s of[-1,1])for(const k of[-1,1]){ctx.beginPath();ctx.moveTo(s*r*.3,r*.32);ctx.lineTo(s*r*1.05,r*(.28+k*.12));ctx.stroke()}
  ctx.restore();
}
function drawFx(){
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life*1.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x*T,p.y*T,T*.06,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life*1.5);ctx.font=`${T*.55}px "Lilita One","Trebuchet MS",sans-serif`;
    ctx.lineWidth=T*.12;ctx.strokeStyle='rgba(33,22,15,.85)';ctx.strokeText(f.text,f.x*T,f.y*T);
    ctx.fillStyle=f.color;ctx.fillText(f.text,f.x*T,f.y*T);
  }
  ctx.globalAlpha=1;
}
function drawBanner(){
  if(!msg)return;
  const w=C*T,h=R*T;
  ctx.fillStyle='rgba(33,22,15,.78)';ctx.fillRect(0,h/2-T*1.4,w,T*2.8);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=msg==='Caught!'?'#ff5a4a':'#ffcc3d';
  ctx.font=`${T*1.05}px "Lilita One","Trebuchet MS",sans-serif`;ctx.fillText(msg,w/2,h/2-(sub?T*.3:0));
  if(sub){ctx.fillStyle='#f7ecdd';ctx.font=`800 ${T*.45}px Nunito,system-ui,sans-serif`;ctx.fillText(sub,w/2,h/2+T*.6)}
}
function drawScaredBar(){
  if(scared<=0)return;
  const w=C*T,max=Math.max(7-level*0.35,3.5);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(T*.3,T*.08,w-T*.6,T*.14);
  ctx.fillStyle='#ff6b4a';ctx.fillRect(T*.3,T*.08,(w-T*.6)*Math.min(1,scared/max),T*.14);
}
function draw(){
  if(!grid)return;
  ctx.clearRect(0,0,C*T,R*T);
  drawFloor();drawCrumbs();drawBonus();drawMouse();cats.forEach(drawCat);drawFx();drawScaredBar();drawBanner();
  $('score').textContent=score;$('level').textContent=level;$('lives').textContent=Math.max(lives,0);
}

/* ---------- flow ---------- */
let last=0;
function loop(t){
  const dt=Math.min((t-last)/1000,0.05);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
function showOverlay(title,text,btn){
  $('ovTitle').textContent=title;$('ovText').textContent=text;$('ovBtn').textContent=btn;
  $('ovBest').textContent=best?`Best score: ${best}`:'';$('overlay').hidden=false;
}
function startGame(){score=0;level=1;lives=3;loadLevel();$('overlay').hidden=true;startIntro('Level 1',LEVELS[0].name)}
function gameOver(){
  state='over';msg='';sub='';
  if(score>best){best=score;try{localStorage.setItem('pantryBest',best)}catch(e){}}
  showOverlay('Game over',`The cat got you on level ${level} in ${L.name}. You scored ${score}.`,'Play again');
}
let resumeTo='play';
function togglePause(){
  if(state==='play'||state==='intro'){resumeTo=state;state='paused';showOverlay('Paused','Take a breather. The cats are waiting.','Resume')}
  else if(state==='paused'){state=resumeTo;$('overlay').hidden=true}
}
$('ovBtn').addEventListener('click',()=>{state==='paused'?togglePause():startGame()});
$('pauseBtn').addEventListener('click',togglePause);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='intro'))togglePause()});

function steer(name){
  const d=DIRS[name];if(!d||!mouse)return;
  mouse.want=d;
  if(mouse.p>0&&d[0]===-mouse.dir[0]&&d[1]===-mouse.dir[1]){
    [mouse.x,mouse.tx]=[mouse.tx,mouse.x];[mouse.y,mouse.ty]=[mouse.ty,mouse.y];
    mouse.p=1-mouse.p;mouse.dir=d;mouse.face=d;
  }
}
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
document.addEventListener('keydown',e=>{
  if(KEYS[e.key]){e.preventDefault();steer(KEYS[e.key])}
  else if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause();
  else if((e.key==='Enter'||e.key===' ')&&(state==='menu'||state==='over')){e.preventDefault();startGame()}
});
document.querySelectorAll('.pad button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();steer(b.dataset.dir);b.classList.add('on')});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('on')));
});
// swipe anywhere on the board
let ts=null;
const board=$('board');
board.addEventListener('touchstart',e=>{const t=e.touches[0];ts={x:t.clientX,y:t.clientY}},{passive:true});
board.addEventListener('touchmove',e=>{
  if(!ts)return;e.preventDefault();
  const t=e.touches[0],dx=t.clientX-ts.x,dy=t.clientY-ts.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>18){steer(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));ts={x:t.clientX,y:t.clientY}}
},{passive:false});
board.addEventListener('touchend',()=>{ts=null});

fit();loadLevel();
showOverlay('Ready, Pip?',"Eat every cheese crumb. Grab a chili to scare the cats, then chase them. Catch the sparkly bonus treats before they vanish! 5 rooms to clear.",'Start');
requestAnimationFrame(t=>{last=t;loop(t)});
if(document.fonts)document.fonts.ready.then(fit);
</script>
</body>
</html>
